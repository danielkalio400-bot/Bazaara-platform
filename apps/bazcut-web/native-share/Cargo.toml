[package]
name = "tauri-plugin-bazcut-share"
version = "0.1.0"
authors = [ "Bazaara" ]
description = "BazCut system export and share bridge"
edition = "2024"
rust-version = "1.90"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-bazcut-share"

[dependencies]
tauri = { version = "2.12.5" }
serde = "1.0"
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
