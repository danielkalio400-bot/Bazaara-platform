name: BazCut native compilation

on:
  workflow_dispatch:
  push:
    branches: [codex/bazcut-native-editor]
    paths:
      - 'apps/bazcut-web/**'
      - '!apps/bazcut-web/README.md'
      - '!apps/bazcut-web/release-status.json'
      - '.github/workflows/bazcut-native.yml'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'apps/bazcut-web/**'
      - '!apps/bazcut-web/README.md'
      - '!apps/bazcut-web/release-status.json'
      - '.github/workflows/bazcut-native.yml'

permissions:
  contents: read

concurrency:
  group: bazcut-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: ${{ matrix.platform }} development build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: android
            runner: ubuntu-latest
          - platform: ios-simulator
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --workspace=@bazaara/bazcut-web --include-workspace-root=false --no-audit
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - name: Configure Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK packages
        if: matrix.platform == 'android'
        shell: bash
        run: |
          BAZCUT_ANDROID_SDK="$RUNNER_TEMP/bazcut-android-sdk"
          mkdir -p "$BAZCUT_ANDROID_SDK/cmdline-tools"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$RUNNER_TEMP/bazcut-android-tools.zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $RUNNER_TEMP/bazcut-android-tools.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/bazcut-android-tools.zip" -d "$BAZCUT_ANDROID_SDK/cmdline-tools"
          mv "$BAZCUT_ANDROID_SDK/cmdline-tools/cmdline-tools" "$BAZCUT_ANDROID_SDK/cmdline-tools/latest"
          BAZCUT_SDK_MANAGER="$BAZCUT_ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          "$BAZCUT_SDK_MANAGER" --sdk_root="$BAZCUT_ANDROID_SDK" --licenses < <(printf 'y\n%.0s' {1..100})
          "$BAZCUT_SDK_MANAGER" --sdk_root="$BAZCUT_ANDROID_SDK" 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_HOME=$BAZCUT_ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$BAZCUT_ANDROID_SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$BAZCUT_ANDROID_SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install CocoaPods
        if: matrix.platform == 'ios-simulator'
        shell: bash
        run: command -v pod >/dev/null || brew install cocoapods
      - name: Check native prerequisites
        run: node apps/bazcut-web/scripts/native.mjs doctor ${{ matrix.platform }}
      - name: Compile and run core tests
        run: node apps/bazcut-web/scripts/native.mjs build ${{ matrix.platform }}
      - name: Install the Windows development package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $bazcutInstaller = Get-ChildItem 'apps/bazcut-web/src-tauri/target/x86_64-pc-windows-msvc/debug/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (!$bazcutInstaller) { throw 'The NSIS installer is missing.' }
          $bazcutInstallDir = Join-Path $env:RUNNER_TEMP 'bazcut-installed'
          $bazcutInstall = Start-Process -FilePath $bazcutInstaller.FullName -ArgumentList @('/S', "/D=$bazcutInstallDir") -PassThru
          if (!$bazcutInstall.WaitForExit(180000)) {
            Stop-Process -Id $bazcutInstall.Id -Force
            throw 'The installer timed out.'
          }
          if ($bazcutInstall.ExitCode -ne 0) { throw "Installer failed with exit $($bazcutInstall.ExitCode)" }
          $bazcutExecutable = Join-Path $bazcutInstallDir 'bazcut.exe'
          if (!(Test-Path -LiteralPath $bazcutExecutable)) { throw 'The installed application is missing.' }
          "BAZCUT_TEST_EXECUTABLE=$bazcutExecutable" >> $env:GITHUB_ENV
      - name: Exercise the installed Windows app
        if: matrix.platform == 'windows'
        run: node apps/bazcut-web/tests/windows-native.mjs
      - name: Install and launch the iOS simulator app
        if: matrix.platform == 'ios-simulator'
        run: node apps/bazcut-web/tests/ios-native.mjs
