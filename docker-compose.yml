services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bazaara
      POSTGRES_PASSWORD: bazaara
      POSTGRES_DB: bazaara
    ports: ["15433:5432"]
    volumes: ["bazaara_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazaara -d bazaara"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6380:6379"]
    volumes: ["bazaara_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bazaara-local
      MINIO_ROOT_PASSWORD: bazaara-local-only-change-me
    ports: ["9000:9000", "9001:9001"]
    volumes: ["bazaara_minio:/data"]

volumes:
  bazaara_postgres:
  bazaara_redis:
  bazaara_minio:
